name: Release

on:
  release:
    types: [published]
  # Manual runs build and test the package and keep it as a workflow artifact; they never touch a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - name: Identify build channel
        shell: pwsh
        run: |
          $channel = if ('${{ github.event_name }}' -eq 'release') { 'release' } else { 'feature-preview' }
          "SANDBOX_MCP_BUILD_CHANNEL=$channel" >> $env:GITHUB_ENV
      - run: npm run package:win
      - name: Smoke-test portable package
        run: node test/package-smoke.js (Get-ChildItem dist\*.zip | Select-Object -First 1 -ExpandProperty FullName)
        shell: pwsh
      - name: Name candidate and publish SHA256
        shell: pwsh
        run: |
          $asset = Get-ChildItem dist\*.zip | Select-Object -First 1
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = node -p "require('./package.json').version"
            $short = '${{ github.sha }}'.Substring(0, 7)
            $name = "sandbox-mcp-feature-preview-$version-$short-win-x64.zip"
            Rename-Item -LiteralPath $asset.FullName -NewName $name
            $asset = Get-Item (Join-Path $asset.DirectoryName $name)
          }
          $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($asset.FullName).sha256", "$hash  $($asset.Name)`n", [Text.UTF8Encoding]::new($false))
          "### Verified Windows x64 package`n`n``$($asset.Name)```n`nSHA256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
      - name: Keep package (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-mcp-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Upload Windows x64 package
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = $env:RELEASE_TAG
          if ($tag -ne "v$version") { throw "Release tag $tag does not match package version v$version." }
          $asset = Get-ChildItem dist\*.zip | Select-Object -First 1 -ExpandProperty FullName
          gh release upload $tag $asset "$asset.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset/checksum upload failed.' }
        shell: pwsh
